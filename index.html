    <style>
        body {
            font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            overflow: hidden; /* 全体スクロールを防止 */
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-3deg); }
            50% { transform: translateX(5px) rotate(3deg); }
            75% { transform: translateX(-5px) rotate(-3deg); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        @keyframes flashDamage {
            0%, 100% { filter: brightness(1) hue-rotate(0deg); transform: scale(1) translateX(0); }
            20% { filter: brightness(2) hue-rotate(-50deg) saturate(3); transform: scale(0.9) translateX(-10px); }
            50% { filter: brightness(0.5) hue-rotate(-50deg) saturate(5); transform: scale(0.95) translateX(10px); }
        }
        .animate-damage { animation: flashDamage 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-walk { animation: hop 0.5s infinite alternate ease-in-out; }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-3px); }
        }
        .animate-breathe { animation: breathe 1.5s infinite alternate ease-in-out; }

        @keyframes darkAura {
            0%, 100% { filter: drop-shadow(0 0 15px #dc2626) brightness(0.8) contrast(1.5); transform: scale(1) rotate(-2deg); }
            50% { filter: drop-shadow(0 0 30px #991b1b) brightness(1.2) contrast(1.8); transform: scale(1.05) rotate(2deg); }
        }
        .animate-enraged {
            animation: darkAura 0.4s infinite alternate ease-in-out;
            transition: all 0.5s ease;
        }

        @keyframes flyRight {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { transform: translate(10vw, -2vh) scale(1.5) rotate(45deg); opacity: 1; }
            80% { transform: translate(60vw, -10vh) scale(2) rotate(360deg); opacity: 1; filter: hue-rotate(180deg); }
            100% { transform: translate(65vw, -5vh) scale(3) rotate(420deg); opacity: 0; filter: hue-rotate(360deg); }
        }
        .magic-projectile {
            position: absolute;
            left: 15%;
            bottom: 25%;
            font-size: 4rem;
            animation: flyRight 0.2s ease-in forwards;
            filter: drop-shadow(0 0 10px #0ea5e9) drop-shadow(0 0 20px #38bdf8);
            z-index: 50;
            pointer-events: none;
        }

                        {phase >= 3 && <circle cx="44" cy="35" r="2" fill="#d8b4fe" className="animate-ping" />}
                        <path d={phase >= 3 ? "M 43 43 C 50 48 57 43 50 43 Z" : "M 46 41 Q 50 46 54 41 Z"} fill={phase >= 3 ? "#000" : "#be185d"} />
                        <path d="M 32 25 Q 40 10 50 20 Q 60 10 68 25 Q 65 15 50 15 Q 35 15 32 25 Z" fill={phase >= 3 ? "#0f172a" : "#1c1917"} />
                    </g>
                );
            } else {
                monsterSvg = (
                    <g>
                        <path d="M 35 45 C 20 60, 30 85, 55 90 C 80 95, 80 60, 65 45 Z" fill={isEnraged ? "#1e1b4b" : "#4d7c0f"} />
                        <ellipse cx="-5" cy="2" rx="4.5" ry="5.5" fill={isEnraged ? "#ef4444" : "#facc15"} />

                );

            return (
                <div style={{ transform: `scale(${scale})`, transformOrigin: 'bottom center' }} className="transition-transform duration-300 flex flex-col justify-end items-center origin-bottom w-full h-full">
                    <svg viewBox="0 0 100 100" 
                         className={`drop-shadow-2xl transition-all duration-200 h-[10vh] sm:h-[15vh] md:h-[20vh] max-h-[160px] min-h-[60px] w-auto 
                         ${isDamaged ? 'brightness-200 hue-rotate-90 scale-90 translate-x-4' : ''}`}>

                    </svg>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState("START");
            const [currentStageIndex, setCurrentStageIndex] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [currentInput, setCurrentInput] = useState("");
            const [timeLeft, setTimeLeft] = useState(5000);
            const [deathReason, setDeathReason] = useState("");
            const [mistakeInfo, setMistakeInfo] = useState({ typed: '', answer: '' });
            
            const [isPlayerAttacking, setIsPlayerAttacking] = useState(false);
            const [isEnemyDamaged, setIsEnemyDamaged] = useState(false);
            const [magicProjectiles, setMagicProjectiles] = useState([]);

            const [clearedStages, setClearedStages] = useState(() => {
                const saved = localStorage.getItem("kuku_quest_save_data");
                return saved ? JSON.parse(saved) : [];
            });
            const [isDataLoaded, setIsDataLoaded] = useState(true);
            const [isBadgeModalOpen, setIsBadgeModalOpen] = useState(false);

            const timerRef = useRef(null);
            const stage = STAGES[currentStageIndex];
            const currentQ = questions[currentQuestionIndex] || { type: 'question', text: "0 × 0", answer: "0", qNum: 1 };
            
            const isBoss = stage?.type === 'boss';
            const isRandomPhase = !isBoss && currentQuestionIndex >= 11;
            const isBossPhase = isBoss && currentQuestionIndex >= Math.floor(questions.length / 2);
            const isEnraged = isRandomPhase || isBossPhase || (currentQ?.phase >= 3);

            useEffect(() => {
                localStorage.setItem("kuku_quest_save_data", JSON.stringify(clearedStages));
            }, [clearedStages]);

            const handleStageClear = () => {
                const currentStageId = STAGES[currentStageIndex].id;
                setClearedStages(prev => {
                    if (!prev.includes(currentStageId)) {
                        return [...prev, currentStageId];
                    }
                    return prev;
                });
                playClearSound();
                setGameState("STAGE_CLEAR");
            };

            const goToStageSelect = () => setGameState("STAGE_SELECT");

            const startStage = (stageIdx) => {
                setCurrentStageIndex(stageIdx);
                const stg = STAGES[stageIdx];
                // 問題の生成
                let qList = [];
                if (stg.type === 'normal') {
                    qList = stg.q.map((q, i) => ({ type: 'question', text: `${q[0]} × ${q[1]}`, answer: String(q[0]*q[1]), qNum: i+1 }));
                } else if (stg.type === 'boss') {
                    qList = stg.q.map((q, i) => ({ type: 'question', text: `${q[0]} × ${q[1]}`, answer: String(q[0]*q[1]), qNum: i+1 }));
                } else {
                    qList = [
                        { type: 'dialogue', text: stg.intro, buttonText: "スタート！" },
                        ...stg.q.map((q, i) => ({ type: 'question', text: `${q[0]} × ${q[1]}`, answer: String(q[0]*q[1]), qNum: i+1 })),
                        { type: 'dialogue', text: stg.clear, buttonText: "クリア！" }
                    ];
                }
                setQuestions(qList);
                setCurrentQuestionIndex(0);
                setCurrentInput("");
                if (stg.type === 'shitennou') {
                    setGameState("PLAYING");
                } else {
                    setGameState("STAGE_INTRO");
                    setTimeout(() => setGameState("PLAYING"), 2000);
                }
            };

            const handleGameOver = (typed, answer) => {
                setMistakeInfo({ typed, answer });
                playGameOverSound();
                setGameState("GAME_OVER");
            };

            // タイマー処理
            useEffect(() => {
                const currentQ = questions[currentQuestionIndex];
                if (gameState !== "PLAYING" || currentQ?.type === 'dialogue') {
                    if (timerRef.current) clearInterval(timerRef.current);
                    return;
                }
                const maxTime = stage?.type === 'shitennou' ? 4000 : 5000;
                setTimeLeft(maxTime);
                const startTime = Date.now();
                
                timerRef.current = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const remaining = maxTime - elapsed;
                    if (remaining <= 0) {
                        clearInterval(timerRef.current);
                        setTimeLeft(0);
                        setMistakeInfo({ typed: "時間切れ", answer: currentQ.answer });
                        playGameOverSound();
                        setGameState("GAME_OVER");
                    } else {
                        setTimeLeft(remaining);
                    }
                }, 30);
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [currentQuestionIndex, gameState, questions, stage]);

            // キー入力処理
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (gameState !== 'PLAYING') return;
                    const currentQ = questions[currentQuestionIndex];
                    if (currentQ?.type === 'dialogue') return;
                    
                    if (!/^[0-9]$/.test(e.key)) return;
                    
                    const answerStr = currentQ.answer;
                    const nextInput = currentInput + e.key;
                    
                    if (answerStr.startsWith(nextInput)) {
                        setCurrentInput(nextInput);
                        if (nextInput === answerStr) {
                            // 正解
                            setIsPlayerAttacking(true);
                            setTimeout(() => setIsPlayerAttacking(false), 150);
                            setIsEnemyDamaged(true);
                            setTimeout(() => setIsEnemyDamaged(false), 300);
                            
                            setTimeout(() => {
                                if (currentQuestionIndex + 1 < questions.length) {
                                    setCurrentInput("");
                                    setCurrentQuestionIndex(prev => prev + 1);
                                } else {
                                    handleStageClear();
                                }
                            }, 300);
                        }
                    } else {
                        handleGameOver(nextInput, answerStr);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, currentInput, currentQuestionIndex, questions]);

            if (gameState === "START") {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-900 px-4 w-full">

                            KUKU QUEST<br/><span className="text-2xl text-white font-bold">〜九九を極めし者たち〜</span>
                        </h1>

                            ぼうけんに でる
                        </button>
                    </div>
                );
            }

            if (gameState === "STAGE_SELECT") {
                return (
                    <div className="flex flex-col items-center justify-start h-screen bg-slate-900 px-4 py-6 overflow-hidden w-full">

                            <h1 className="text-2xl md:text-3xl font-bold text-cyan-300">ステージをえらぶ</h1>
                            <button onClick={() => setIsBadgeModalOpen(true)} className="bg-purple-600 text-white font-bold px-4 py-2 rounded-full shadow-lg">
                                🏆 バッジずかん
                            </button>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-5xl overflow-y-auto pb-6">
                            {STAGES.map((s, idx) => (
                                <button key={s.id} onClick={() => startStage(idx)} className={`p-4 rounded-xl flex flex-col items-center justify-center font-bold shadow transition border-2 ${clearedStages.includes(s.id) ? 'bg-green-900 border-green-500 text-green-100' : 'bg-slate-800 border-slate-600 text-slate-200'}`}>
                                    <span className="text-4xl mb-2">{s.icon}</span>
                                    <span className="text-sm md:text-base text-center">{s.name} {clearedStages.includes(s.id) && '🌟'}</span>
                                </button>
                            ))}
                        </div>
                        {isBadgeModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                                <div className="bg-slate-900 border-4 border-purple-500 w-full max-w-4xl max-h-[85vh] rounded-2xl p-6 flex flex-col">
                                    <h2 className="text-2xl font-bold text-purple-300 mb-4">🏆 バッジ図鑑</h2>
                                    <div className="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {STAGES.map(s => {
                                            const isUnlocked = clearedStages.includes(s.id);
                                            return (
                                                <div key={s.id} className={`p-4 rounded-xl border flex items-start gap-4 ${isUnlocked ? 'bg-slate-800 border-purple-400' : 'bg-slate-900 border-slate-700 opacity-50'}`}>
                                                    <div className="text-4xl">{isUnlocked ? s.icon : '🔒'}</div>
                                                    <div>
                                                        <div className="font-bold text-cyan-300">{s.name}</div>
                                                        <div className="text-sm text-white mt-1 whitespace-normal break-words">
                                                            {isUnlocked ? 'このステージを見事クリアした証だ！' : 'まだクリアしていない。'}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button onClick={() => setIsBadgeModalOpen(false)} className="mt-4 px-6 py-2 bg-purple-600 text-white font-bold rounded-full self-center">とじる</button>
                                </div>
                            </div>
                        )}

                );
            }

            if (gameState === "GAME_OVER") {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-900 px-4 text-center">

                        <div className="bg-black/50 p-6 rounded-xl text-xl md:text-2xl font-bold border border-red-800 mb-8">

                    <div className="flex flex-col items-center justify-center h-screen bg-slate-900 px-4 text-center">

                            つぎへすすむ

                <div className="flex flex-col h-screen w-full bg-slate-900 overflow-hidden font-sans relative">
                    {currentQ?.type === 'dialogue' && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
                            <div className="bg-slate-800 border-2 border-purple-500 p-6 rounded-2xl max-w-xl text-center">
                                <p className="text-2xl text-white font-bold mb-6 whitespace-pre-wrap">{currentQ.text}</p>
                                <button onClick={() => {
                                    if (currentQuestionIndex + 1 < questions.length) {
                                        setCurrentQuestionIndex(prev => prev + 1);
                                    } else {
                                        handleStageClear();
                                    }
                                }} className="px-8 py-3 bg-purple-600 text-white font-bold rounded-full text-xl">{currentQ.buttonText}</button>
                            </div>
                        </div>
                    )}

                    <div className="p-2 bg-slate-800 border-b border-slate-700 flex justify-between items-center text-white z-20">
                        <div className="font-bold">{stage?.name}</div>
                        <div className="text-sm bg-slate-700 px-3 rounded-full">
                            もんだい {currentQuestionIndex + (currentQ.type==='question'?1:0)} / {questions.filter(q=>q.type==='question').length}
                        </div>
                    </div>

                    <div className="text-center py-2 z-10 pointer-events-none">
                        <div className={`text-5xl font-black font-mono ${timeLeft > 2000 ? 'text-white' : 'text-red-500 animate-pulse'}`}>
                            {currentQ.type === 'question' ? (timeLeft / 1000).toFixed(2) : "--.--"}
                        </div>
                    </div>

                    <div className="flex-1 relative flex flex-col justify-end pb-4 border-b-4 border-slate-700">
                        <div className="absolute bottom-2 left-[10%] z-10">
                            <Hero isAttacking={isPlayerAttacking} />
                        </div>
                        <div className="absolute bottom-2 right-[10%] z-10">
                            <Monster type={stage?.enemyType || 'slime'} isEnraged={isEnraged} isDamaged={isEnemyDamaged} scale={1} />
                        </div>
                    </div>

                    <div className="bg-slate-800 p-4 flex flex-col items-center justify-center z-30 h-1/4">
                        <div className="text-4xl md:text-5xl font-black font-mono text-white bg-slate-900 py-3 px-6 rounded-xl border border-slate-600 w-full max-w-lg text-center shadow-inner">
                            {currentQ.text && currentQ.text} = <span className="text-yellow-300">{currentInput || '?'}</span>
                        </div>
                        <p className="text-slate-400 mt-2">キーボードでこたえを入力！</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
